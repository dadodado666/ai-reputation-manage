<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moj Brezplačni AI Pomočnik</title>
    <!-- Vključimo brezplačno knjižnico Puter za dostop do AI brez ključev -->
    <script src="https://js.puter.com/v2/"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; text-align: center; }
        textarea, input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; padding: 14px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #218838; }
        .odgovor { background: #f8f9fa; padding: 15px; margin-top: 20px; border-radius: 4px; border-left: 5px solid #28a745; text-align: left; white-space: pre-wrap; }
    </style>
</head>
<body>

    <h2>AI Generator Odgovorov na Ocene 🚀</h2>
    <p style="color: #666; font-size: 14px;">Brez registracije in brez API ključev.</p>

    <input type="text" id="imePodjetja" placeholder="Ime podjetja (npr. Frizerski salon Karmen)">
    <textarea id="tekstOcene" rows="4" placeholder="Prilepite oceno stranke, ki jo je pustila na Googlu..."></textarea>
    
    <button onclick="generirajOdgovor()">Ustvari AI Odgovor ✨</button>

    <div id="rezultat" style="display: none;">
        <h3>Predlagan profesionalni odgovor:</h3>
        <div id="aiTekst" class="odgovor"></div>
    </div>

    <script>
        async function generirajOdgovor() {
            const imePodjetja = document.getElementById('imePodjetja').value;
            const tekstOcene = document.getElementById('tekstOcene').value;

            if(!imePodjetja || !tekstOcene) {
                alert('Prosimo, izpolnite obe polji.');
                return;
            }

            // Prikažemo okno za rezultat in izpišemo, da AI razmišlja
            document.getElementById('aiTekst').innerText = "Umetna inteligenca Gemini razmišlja o odgovoru...";
            document.getElementById('rezultat').style.display = "block";

            // Sestavimo navodilo za AI
            const navodilo = `Dobil si spletno oceno za podjetje "${imePodjetja}". Besedilo ocene je: "${tekstOcene}". Napiši kratek, prijazen in profesionalen odgovor v slovenščini, ki ga bo lastnik podjetja objavil kot odgovor stranki na Googlu.`;

            try {
                // Pokličemo Google Gemini preko Puter knjižnice brez kakršnih koli ključev!
                const response = await puter.ai.chat(navodilo, { model: 'google/gemini-2.5-flash' });
                
                // Izpišemo dobljen odgovor na zaslon
                document.getElementById('aiTekst').innerText = response.message.content;
            } catch (error) {
                console.error(error);
                document.getElementById('aiTekst').innerText = "Prišlo je do napake pri komunikaciji z AI.";
            }
        }
    </script>

</body>
</html>
