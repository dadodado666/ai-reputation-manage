<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <title>Moj AI Pomočnik</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; text-align: center; }
        textarea, input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #0070f3; color: white; padding: 12px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #0051a8; }
        .odgovor { background: #f4f4f4; padding: 15px; margin-top: 20px; border-radius: 4px; border-left: 5px solid #0070f3; text-align: left; }
    </style>
</head>
<body>
    <h2>AI Generator Odgovorov</h2>
    <input type="text" id="imeFirme" placeholder="Ime vašega podjetja (npr. Gostilna Pri Jožetu)">
    <textarea id="tekstOcene" rows="4" placeholder="Prilepite oceno stranke iz Googla..."></textarea>
    <button onclick="generiraj()">Ustvari AI Odgovor ✨</button>
    <div id="prikaz" style="display: none;">
        <h3>Predlagan odgovor:</h3>
        <div id="aiOdgovor" class="odgovor"></div>
    </div>
    <script>
        async function generiraj() {
            const imeFirme = document.getElementById('imeFirme').value;
            const tekstOcene = document.getElementById('tekstOcene').value;
            if(!imeFirme || !tekstOcene) { alert('Prosimo, izpolnite obe polji.'); return; }
            document.getElementById('aiOdgovor').innerText = "Umetna inteligenca razmišlja...";
            document.getElementById('prikaz').style.display = "block";
            try {
                const res = await fetch('/api/odgovor', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ imeFirme, tekstOcene })
                });
                const data = await res.json();
                document.getElementById('aiOdgovor').innerText = data.reply || "Napaka.";
            } catch (err) { document.getElementById('aiOdgovor').innerText = "Napaka pri povezavi."; }
        }
    </script>
</body>
</html>
